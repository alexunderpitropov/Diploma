<header class="header" [ngClass]="themeService.theme()">
  <div class="header__inner">
    <a class="logo" routerLink="/platforms" (click)="closeMenu()">ConsoleShop</a>

    <button class="burger" (click)="toggleMenu()" [class.open]="menuOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.nav--open]="menuOpen()">
      <a routerLink="/platforms"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact:true}"
         (click)="closeMenu()">
        Платформы
      </a>

      <a routerLink="/catalog" routerLinkActive="active" (click)="closeMenu()">
        Каталог
      </a>

      <a class="cart-link" routerLink="/cart" routerLinkActive="active" (click)="closeMenu()">
        Корзина
        @if (cartCount.count() > 0) {
          <span class="cart-badge">{{ cartCount.count() }}</span>
        }
      </a>

      @if (auth.isLoggedIn()) {
        <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
          Личный кабинет
        </a>
      }

      @if (!auth.isLoggedIn()) {
        <a routerLink="/auth" (click)="closeMenu()">
          Вход
        </a>
      }

      @if (auth.isAdmin()) {
        <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeMenu()">
          Админ
        </a>
      }

      @if (auth.isLoggedIn()) {
        <a class="logout" (click)="logout()">
          Выйти
        </a>
      }
    </nav>
  </div>
</header>
